[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-tool"
version = "0.3.2"
description = "Cross-platform attendance calculation engine"
authors = [{ name = "\u004d\u0069\u0063\u0068\u0061\u0065\u006c\u0043\u0068\u0075\u0069" }]
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "chinese-calendar>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pyinstaller>=6.21,<7",
]

[project.scripts]
attendance-engine = "attendance_engine.cli:main"

[tool.setuptools.packages.find]
include = ["attendance_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
