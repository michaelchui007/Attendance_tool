name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "将本次版本标记为预发布版本"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve and validate application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python scripts/resolve_app_version.py)"
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${tag}." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" != "release/${tag}" ]]; then
            echo "Release builds must use release/${tag}, not ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Building release ${tag}"

  windows-x64:
    name: Build Windows x64 installer
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Python engine tests
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation -e ".[dev]"
          python -m pytest
      - name: Validate Windows build script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/build_windows.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Build Windows NSIS installer
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-windows-x64-${{ needs.metadata.outputs.version }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    name: Build macOS arm64 installer
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Python engine tests
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --no-build-isolation -e ".[dev]"
          python3 -m pytest
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Build unsigned macOS DMG
        env:
          PYTHON: python3
        run: ./scripts/build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-macos-arm64-${{ needs.metadata.outputs.version }}-unsigned
          path: |
            release/考勤统计_${{ needs.metadata.outputs.version }}_aarch64_unsigned.dmg
            release/考勤统计_${{ needs.metadata.outputs.version }}_aarch64_unsigned.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - metadata
      - windows-x64
      - macos-arm64
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: attendance-*-${{ needs.metadata.outputs.version }}*
          path: release-assets
          merge-multiple: true
      - name: Verify installers and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path("release-assets")
          windows_installers = list(root.rglob("*.exe"))
          macos_installers = list(root.rglob("*.dmg"))
          installers = sorted([*windows_installers, *macos_installers])
          if len(windows_installers) != 1 or len(macos_installers) != 1:
              names = ", ".join(str(path) for path in installers) or "none"
              raise SystemExit(f"Expected one Windows EXE and one macOS DMG, found: {names}")
          lines = []
          for path in installers:
              digest = sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          (root / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
      - name: Create or update versioned GitHub Release
        shell: bash
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          current_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          tag_exists=false
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_exists=true
            tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${tag_commit}" != "${current_commit}" ]]; then
              echo "${RELEASE_TAG} already points to ${tag_commit}, not ${current_commit}." >&2
              echo "Please increase the project version before publishing a different commit." >&2
              exit 1
            fi
          fi

          mapfile -d '' assets < <(
            find release-assets -type f \
              \( -name '*.exe' -o -name '*.dmg' -o -name '*.sha256' -o -name 'SHA256SUMS.txt' \) \
              -print0
          )
          if [[ "${#assets[@]}" -lt 3 ]]; then
            echo "Release assets are incomplete." >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to overwrite published assets." >&2
            exit 1
          else
            create_args=(
              release create "${RELEASE_TAG}" "${assets[@]}"
              --title "考勤统计 ${RELEASE_TAG}"
              --notes-file "docs/releases/${RELEASE_TAG}.md"
            )
            if [[ "${tag_exists}" == "true" ]]; then
              create_args+=(--verify-tag)
            else
              create_args+=(--target "${GITHUB_SHA}")
            fi
            if [[ "${PRERELEASE:-false}" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}"
          fi

          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq .url)"
          {
            echo "## 发布完成"
            echo
            echo "- 版本：${RELEASE_TAG}"
            echo "- 下载：${release_url}"
          } >> "$GITHUB_STEP_SUMMARY"
