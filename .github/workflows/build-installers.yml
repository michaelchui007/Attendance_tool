name: Build desktop installers

on:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Python engine tests
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation -e ".[dev]"
          python -m pytest
      - name: Validate Windows build script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/build_windows.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Build Windows NSIS installer
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Python engine tests
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --no-build-isolation -e ".[dev]"
          python3 -m pytest
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Build unsigned macOS DMG
        env:
          PYTHON: python3
        run: ./scripts/build_macos_dmg.sh
      - name: Resolve application version
        id: app-version
        run: |
          echo "version=$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json", encoding="utf-8"))["version"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-macos-arm64-unsigned
          path: |
            release/考勤统计_${{ steps.app-version.outputs.version }}_aarch64_unsigned.dmg
            release/考勤统计_${{ steps.app-version.outputs.version }}_aarch64_unsigned.dmg.sha256
          if-no-files-found: error
